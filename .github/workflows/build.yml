name: Build and Test
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - { name: "Linux", flag: "--linux", folder: "build-linux" }
          - { name: "Windows", flag: "--win32", folder: "build-win32" }
          - {
              name: "macOS-x86_64",
              flag: "--mac-x86_64",
              folder: "build-mac-x86_64",
            }
          - {
              name: "macOS-ARM64",
              flag: "--mac-arm64",
              folder: "build-mac-arm64",
            }

    name: Build (${{ matrix.platform.name }})

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Get latest CMake and ninja
        uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar xz-utils

      - name: Build for ${{ matrix.platform.name }}
        run: ./tools/run_make.sh ${{ matrix.platform.flag }}

      - name: Upload library artifacts
        uses: actions/upload-artifact@v3
        with:
          name: library-${{ matrix.platform.name }}
          path: ${{ matrix.platform.folder }}/fs/**/*
          retention-days: 7

      - name: Upload test binary
        uses: actions/upload-artifact@v3
        with:
          name: test-binary-${{ matrix.platform.name }}
          path: ${{ matrix.platform.folder }}/unittest/fmtreader_test*
          retention-days: 7

  test-linux:
    needs: build
    runs-on: ubuntu-latest
    name: Test (Linux)

    steps:
      - name: Download test binary
        uses: actions/download-artifact@v3
        with:
          name: test-binary-Linux
          path: test-binary

      - name: Run tests
        run: |
          chmod +x test-binary/fmtreader_test
          cd test-binary
          ./fmtreader_test --gtest_output=xml:test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-Linux
          path: test-binary/test-results.xml
          retention-days: 7

  test-windows:
    needs: build
    runs-on: ubuntu-latest
    name: Test (Windows)

    steps:
      - name: Download test binary
        uses: actions/download-artifact@v3
        with:
          name: test-binary-Windows
          path: test-binary

      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32 wine64

      - name: Initialize Wine
        run: |
          mkdir -p ~/.wine
          export WINEPREFIX=~/.wine
          winecfg || true

      - name: Run tests
        run: |
          cd test-binary
          wine ./fmtreader_test.exe --gtest_output=xml:test-results.xml || true

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-Windows
          path: test-binary/test-results.xml
          retention-days: 7

  publish-test-results:
    needs: [test-linux, test-windows]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v3
        with:
          pattern: test-results-*
          path: test-results

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/**/*.xml
